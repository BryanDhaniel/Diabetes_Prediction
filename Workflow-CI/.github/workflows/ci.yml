name: MLflow CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: 3.12.7

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow==2.19.0

    - name: Run MLflow Project
      env:
        MLFLOW_TRACKING_URI: ${{ secrets.DAGSHUB_TRACKING_URI }}
        MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
      run: |
        cd MLProject
        mlflow run .

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Model
      env:
        MLFLOW_TRACKING_URI: ${{ secrets.DAGSHUB_TRACKING_URI }}
      run: |
        # Get latest run ID
        RUN_ID=$(mlflow runs search --experiment-ids 0 --order-by "start_time DESC" --max-results 1 | jq -r '.runs[0].info.run_id')
        mlflow models build-docker -m "runs:/$RUN_ID/model" -n my-model-image:latest
    
    - name: Push Docker Image
      run: |
        docker tag my-model-image:latest ${{ secrets.DOCKER_USERNAME }}/diabetes-prediction-model:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/diabetes-prediction-model:latest
